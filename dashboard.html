<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <script src="js/storage.js"></script>
  <script src="js/access-control.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sciences Immersion | Tableau de bord</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="dashboard/dashboard.css" />
  <script type="module" src="dashboard/dashboard.js"></script>
</head>

<body class="teacher-page">
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-art-cell" aria-hidden="true">
        <div class="hero-art">
          <img src="assets/Friends.webp" alt="" width="230" height="300" />
        </div>
      </div>
      <div class="hero-text">
        <p class="hero-kicker">Sciences en immersion <span aria-hidden="true">·</span> Tableau de bord</p>
        <h1 class="hero-title" id="t-hello">Tableau de bord</h1>
        <p class="hero-date" id="t-date"></p>
        <dl class="hero-stats" id="t-hero-stats" hidden>
          <div><dt>Classes</dt><dd id="t-stat-classes">—</dd></div>
          <div><dt>Élèves</dt><dd id="t-stat-students">—</dd></div>
          <div><dt>Actifs ces 7 derniers jours</dt><dd id="t-stat-active">—</dd></div>
        </dl>
      </div>
      <a href="index.html" class="hero-back">Retour au site</a>
    </div>
    <div class="hero-stripe" aria-hidden="true"><span></span><span></span><span></span></div>
  </header>

  <nav class="t-tabs" id="t-tabs" role="tablist" hidden>
    <button type="button" class="t-tab" role="tab" data-view="manage">Classes et élèves</button>
    <button type="button" class="t-tab is-active" role="tab" data-view="class">Suivi</button>
    <button type="button" class="t-tab" role="tab" data-view="journal">Journal</button>
    <button type="button" class="t-tab" role="tab" data-view="activities">Bilan des activités</button>
    <button type="button" class="t-tab" role="tab" data-view="homework">Devoirs</button>
  </nav>

  <main class="t-main">
    <p id="t-status" class="t-status" role="status">Chargement…</p>
    <div id="t-view"></div>
  </main>

  <dialog id="t-dialog" class="t-dialog">
    <form method="dialog">
      <p id="t-dialog-text"></p>
      <div class="t-dialog-actions">
        <button value="cancel" class="t-btn">Annuler</button>
        <button value="ok" class="t-btn t-btn-primary" id="t-dialog-ok">Confirmer</button>
      </div>
    </form>
  </dialog>
</body>

</html>
